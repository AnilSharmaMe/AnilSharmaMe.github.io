<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
    <rect width="400" height="800" fill="#09090b"/>

    <!-- Sheet backdrop (map dimmed behind) -->
    <rect x="0" y="0" width="400" height="800" fill="#18181b"/>
    <path d="M40 0 L180 400 M0 140 L400 190 M300 0 L320 400" stroke="#27272a" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Bottom sheet -->
    <rect x="0" y="270" width="400" height="530" rx="28" fill="#09090b"/>
    <rect x="170" y="292" width="60" height="5" rx="2.5" fill="#3f3f46"/>

    <text x="200" y="340" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Send Safety Alert</text>
    <text x="200" y="364" fill="#a1a1aa" font-family="sans-serif" font-size="13" text-anchor="middle">Goes straight to your family circle</text>

    <!-- Preset chips -->
    <rect x="24" y="392" width="150" height="46" rx="23" fill="#dc2626"/>
    <text x="99" y="420" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">I need help</text>

    <rect x="184" y="392" width="192" height="46" rx="23" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="280" y="420" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Call me when free</text>

    <rect x="24" y="448" width="150" height="46" rx="23" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="99" y="476" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Running late</text>

    <rect x="184" y="448" width="192" height="46" rx="23" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="280" y="476" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Feeling unsafe</text>

    <!-- Custom message field -->
    <rect x="24" y="516" width="352" height="80" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="40" y="546" fill="#71717a" font-family="sans-serif" font-size="14">Or write your own message...</text>

    <!-- Send button -->
    <rect x="24" y="620" width="352" height="56" rx="28" fill="url(#sendGrad)"/>
    <text x="200" y="655" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">🚨 Send to Family</text>

    <text x="200" y="710" fill="#71717a" font-family="sans-serif" font-size="12" text-anchor="middle">Delivered as a push notification instantly</text>

    <defs>
        <linearGradient id="sendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#dc2626"/>
        </linearGradient>
    </defs>
</svg>
