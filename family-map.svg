<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
    <rect width="400" height="800" fill="#000000"/>

    <!-- Map Background -->
    <rect x="0" y="0" width="400" height="420" fill="#18181b"/>

    <!-- Roads -->
    <path d="M40 0 L180 420 M0 150 L400 200 M300 0 L320 420 M0 300 L400 250" stroke="#27272a" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M40 0 L180 420 M0 150 L400 200 M300 0 L320 420 M0 300 L400 250" stroke="#3f3f46" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Location Fuzzing Area Example (Optional overlay, showing how it looks on the map) -->
    <circle cx="100" cy="250" r="40" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.5)" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Pins -->
    <g transform="translate(160, 180)">
        <circle cx="20" cy="20" r="28" fill="#3b82f6" opacity="0.2"/>
        <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
        <circle cx="20" cy="20" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
        <text x="20" y="26" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">👤</text>
        <rect x="-15" y="48" width="70" height="22" rx="6" fill="#ffffff" opacity="0.9"/>
        <text x="20" y="63" fill="#3b82f6" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">You</text>
    </g>

    <g transform="translate(80, 80)">
        <circle cx="20" cy="20" r="18" fill="#f97316"/>
        <circle cx="20" cy="20" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
        <text x="20" y="26" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">👩</text>
        <rect x="-20" y="48" width="80" height="22" rx="6" fill="#ffffff" opacity="0.9"/>
        <text x="20" y="63" fill="#f97316" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mom</text>
    </g>

    <g transform="translate(280, 280)">
        <circle cx="20" cy="20" r="18" fill="#a855f7"/>
        <circle cx="20" cy="20" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
        <text x="20" y="26" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">👨</text>
        <rect x="-20" y="48" width="80" height="22" rx="6" fill="#ffffff" opacity="0.9"/>
        <text x="20" y="63" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Dad</text>
    </g>

    <!-- Top Bar Overlay -->
    <rect x="0" y="0" width="400" height="110" fill="url(#topGrad)"/>
    <text x="200" y="60" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Family Safety</text>
    <text x="200" y="80" fill="#a1a1aa" font-family="sans-serif" font-size="13" text-anchor="middle">Private &amp; Secure</text>
    <rect x="340" y="40" width="40" height="40" rx="20" fill="rgba(255,255,255,0.1)"/>
    <text x="360" y="66" fill="#ffffff" font-size="20" text-anchor="middle">➕</text>

    <!-- Member List -->
    <rect x="0" y="400" width="400" height="400" fill="#09090b" rx="24"/>
    <text x="24" y="440" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Family Members</text>

    <!-- Member 1 -->
    <rect x="24" y="460" width="352" height="76" rx="16" fill="#18181b"/>
    <circle cx="56" cy="498" r="22" fill="#3b82f6"/>
    <text x="56" y="506" fill="#ffffff" font-size="22" text-anchor="middle">👤</text>
    <text x="96" y="490" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">You</text>
    <text x="96" y="512" fill="#a1a1aa" font-family="sans-serif" font-size="14">Updated Just now</text>

    <!-- Member 2 -->
    <rect x="24" y="548" width="352" height="76" rx="16" fill="#18181b"/>
    <circle cx="56" cy="586" r="22" fill="#f97316"/>
    <text x="56" y="594" fill="#ffffff" font-size="22" text-anchor="middle">👩</text>
    <text x="96" y="578" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Mom</text>
    <text x="96" y="600" fill="#a1a1aa" font-family="sans-serif" font-size="14">Updated 5 mins ago</text>
    <circle cx="340" cy="586" r="16" fill="#27272a"/>
    <text x="340" y="592" fill="#ffffff" font-size="16" text-anchor="middle">⋮</text>

    <!-- Member 3 -->
    <rect x="24" y="636" width="352" height="76" rx="16" fill="#18181b"/>
    <circle cx="56" cy="674" r="22" fill="#a855f7"/>
    <text x="56" y="682" fill="#ffffff" font-size="22" text-anchor="middle">👨</text>
    <text x="96" y="666" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold">Dad</text>
    <text x="96" y="688" fill="#3b82f6" font-family="sans-serif" font-size="14" font-weight="600">Requesting location...</text>
    <circle cx="340" cy="674" r="16" fill="#27272a"/>
    <text x="340" y="680" fill="#ffffff" font-size="16" text-anchor="middle">⋮</text>

    <!-- Trigger Alert Button (Floating) -->
    <rect x="24" y="660" width="352" height="56" rx="28" fill="#dc2626" opacity="0.95"/>
    <text x="200" y="694" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">⚠️ Trigger Safety Alert</text>

    <!-- Bottom Nav Bar -->
    <rect x="0" y="710" width="400" height="90" fill="#18181b" opacity="0.95"/>
    <text x="60" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">🏠</text>
    <text x="153" y="750" fill="#ffffff" font-size="24" text-anchor="middle">👥</text>
    <text x="246" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">📷</text>
    <text x="340" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">⚙️</text>
    <circle cx="153" cy="770" r="3" fill="#ffffff"/>

    <defs>
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(0,0,0,0.9)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </linearGradient>
    </defs>
</svg>