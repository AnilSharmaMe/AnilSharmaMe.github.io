<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
    <rect width="400" height="800" fill="#000000"/>

    <!-- Header -->
    <rect x="0" y="0" width="400" height="110" fill="#09090b"/>
    <text x="24" y="60" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Missing Persons</text>
    <text x="24" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="13">National Missing Persons Coordination Centre</text>

    <!-- Profile Card 1 -->
    <rect x="24" y="132" width="352" height="150" rx="20" fill="#18181b"/>
    <rect x="24" y="132" width="110" height="150" rx="20" fill="#27272a"/>
    <text x="79" y="215" fill="#71717a" font-size="40" text-anchor="middle">👤</text>
    <text x="150" y="164" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Jordan T.</text>
    <rect x="150" y="176" width="90" height="22" rx="6" fill="rgba(168,85,247,0.15)"/>
    <text x="158" y="191" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold">MP-20481</text>
    <text x="150" y="216" fill="#a1a1aa" font-family="sans-serif" font-size="13">Last seen: Geelong, VIC</text>
    <text x="150" y="238" fill="#a1a1aa" font-family="sans-serif" font-size="13">18 Aug 2026</text>
    <rect x="150" y="250" width="130" height="20" rx="6" fill="#27272a"/>
    <text x="158" y="264" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="bold">Face match available</text>

    <!-- Profile Card 2 -->
    <rect x="24" y="298" width="352" height="150" rx="20" fill="#18181b"/>
    <rect x="24" y="298" width="110" height="150" rx="20" fill="#27272a"/>
    <text x="79" y="381" fill="#71717a" font-size="40" text-anchor="middle">👤</text>
    <text x="150" y="330" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Alex R.</text>
    <rect x="150" y="342" width="90" height="22" rx="6" fill="rgba(168,85,247,0.15)"/>
    <text x="158" y="357" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold">MP-20356</text>
    <text x="150" y="382" fill="#a1a1aa" font-family="sans-serif" font-size="13">Last seen: Ballarat, VIC</text>
    <text x="150" y="404" fill="#a1a1aa" font-family="sans-serif" font-size="13">2 Sep 2026</text>
    <rect x="150" y="416" width="130" height="20" rx="6" fill="#27272a"/>
    <text x="158" y="430" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="bold">Face match available</text>

    <!-- Scan CTA -->
    <rect x="24" y="470" width="352" height="64" rx="20" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,5"/>
    <text x="200" y="497" fill="#3b82f6" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">📷 Run a face match against this list</text>
    <text x="200" y="518" fill="#71717a" font-family="sans-serif" font-size="11" text-anchor="middle">Runs entirely on your device</text>

    <!-- Bottom Nav Bar -->
    <rect x="0" y="710" width="400" height="90" fill="#18181b" opacity="0.95"/>
    <text x="60" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">🏠</text>
    <text x="153" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">👥</text>
    <text x="246" y="750" fill="#ffffff" font-size="24" text-anchor="middle">📷</text>
    <text x="340" y="750" fill="#a1a1aa" font-size="24" text-anchor="middle">⚙️</text>
    <circle cx="246" cy="770" r="3" fill="#ffffff"/>
</svg>
