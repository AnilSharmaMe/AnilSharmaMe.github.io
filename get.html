<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get SpotterApp | iPhone and Android</title>
    <meta name="description" content="Get SpotterApp, the free family map and local alerts app from a Melbourne startup, on the App Store or Google Play.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://spotterapp.com.au/">
    <style>
        :root { --primary: #4072DA; --text: #13151A; --muted: #5B6472; --bg: #FFFFFF; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); text-align: center; line-height: 1.5; }
        main { max-width: 420px; width: 100%; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 1.8rem; margin: 16px 0 4px; }
        p { color: var(--muted); margin: 0 0 20px; }
        .btn { display: block; padding: 16px 20px; margin: 12px 0; border-radius: 14px; background: var(--primary); color: #fff; font-weight: 600; font-size: 1.1rem; text-decoration: none; }
        .btn.play { background: #2563EB; }
        .small { font-size: 0.9rem; margin-top: 24px; }
        @media (prefers-color-scheme: dark) { :root { --text: #F1F3F7; --muted: #A8B0BD; --bg: #0E1014; } }
    </style>
</head>
<body>
    <main>
        <img src="app-icon.png" alt="SpotterApp icon" width="96" height="96">
        <h1>SpotterApp</h1>
        <p>Free on iPhone and Android.<br>A family map and local alerts, from a Melbourne startup.</p>
        <a id="ios" class="btn" href="https://apps.apple.com/au/app/spotterapp/id6755062103">Download on the App Store</a>
        <a id="android" class="btn play" href="https://play.google.com/store/apps/details?id=spotter.anilsharmame.github.com">Get it on Google Play</a>
        <p class="small">Searching the store instead? Look for <strong>&ldquo;SpotterApp&rdquo;</strong>.<br>In an emergency call 000.</p>
    </main>
    <script>
    // Sends a phone straight to its own store; any other device (a laptop, say) stays here and sees both buttons.
    // /get?src=instagram tags the visit so the store's own reports can show where installs came from. No cookies, no analytics script.
    var APPLE_PROVIDER_TOKEN = ''; // App Store Connect > App Analytics > Campaigns gives the number (the "pt" value); the tag works only once it is filled in
    var IOS_URL = 'https://apps.apple.com/au/app/spotterapp/id6755062103';
    var PLAY_URL = 'https://play.google.com/store/apps/details?id=spotter.anilsharmame.github.com';

    function cleanSource(raw) { return (/^[a-z0-9_-]{1,40}$/i.test(raw || '') ? raw : 'website').toLowerCase(); }

    function platform(ua, platformName, touchPoints) {
        if (/android/i.test(ua)) return 'android';
        if (/iphone|ipad|ipod/i.test(ua) || (platformName === 'MacIntel' && touchPoints > 1)) return 'ios'; // iPadOS reports itself as a Mac
        return 'other';
    }

    function storeUrl(kind, src) {
        var source = cleanSource(src);
        if (kind === 'ios') return IOS_URL + '?' + (APPLE_PROVIDER_TOKEN ? 'pt=' + encodeURIComponent(APPLE_PROVIDER_TOKEN) + '&' : '') + 'ct=' + encodeURIComponent(source) + '&mt=8';
        if (kind === 'android') return PLAY_URL + '&referrer=' + encodeURIComponent('utm_source=' + source + '&utm_medium=social&utm_campaign=get');
        return null;
    }

    if (typeof window !== 'undefined') {
        var src = new URLSearchParams(window.location.search).get('src');
        document.getElementById('ios').href = storeUrl('ios', src);
        document.getElementById('android').href = storeUrl('android', src);
        var kind = platform(navigator.userAgent, navigator.platform, navigator.maxTouchPoints);
        if (kind !== 'other') window.location.replace(storeUrl(kind, src));
    }
    if (typeof module !== 'undefined') module.exports = { platform: platform, storeUrl: storeUrl, cleanSource: cleanSource };
    </script>
</body>
</html>
